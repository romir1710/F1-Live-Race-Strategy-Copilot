services:
  # ── Single consolidated backend web service ─────────────────────────────────
  # Hosts: replay producer + strategy consumer + WebSocket + LangGraph agent
  # All as asyncio background tasks in one FastAPI process.
  # No Kafka, no Redis — uses Postgres LISTEN/NOTIFY + in-process state dict.
  - type: web
    name: f1-strategy-copilot-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend
      pip install uv
      uv pip install --system -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # paste from Neon dashboard (postgresql+asyncpg://...)
      - key: DATABASE_URL_SYNC
        sync: false   # paste from Neon dashboard (postgresql://...)
      - key: GOOGLE_API_KEY
        sync: false   # paste from Google AI Studio
      - key: SESSION_KEY
        value: "9158"     # update after running fetch_race_data.py
      - key: FOCUS_DRIVERS
        value: "1,11,16"  # update after running fetch_race_data.py
      - key: REPLAY_SPEED
        value: "1.0"
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
